[project]
name = "ultimate-music-sync"
version = "1.0.0"
description = "Rights-aware offline music library synchronizer with a desktop control panel, free-source acquisition fallback, and synced-lyrics sidecars"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mutagen>=1.47,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/music-server-suite"

[project.scripts]
ums = "ultimate_music_sync.cli:main"
ums-hourly-sync = "ultimate_music_sync.hourly_sync:main"
ums-acquire = "ultimate_music_sync.acquire:main"
ums-auto-acquire = "ultimate_music_sync.auto_acquire:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultimate_music_sync"]

[tool.pytest.ini_options]
testpaths = ["tests", "control-center/tests"]
pythonpath = ["src", "control-center"]
